[project]
name = "yahoo-fantasy-mcp"
version = "0.1.0"
description = "MCP server for managing a Yahoo Fantasy Football team: read rosters and matchups, set lineups, add/drop, waivers and trades."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
yahoo-fantasy-mcp = "yahoo_fantasy_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yahoo_fantasy_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
